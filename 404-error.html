<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <title>404 - Page Not Found | WACAAegis</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; background: #f8fafc; }
        .error-code { font-size: 10rem; font-weight: 900; line-height: 1; color: var(--primary); opacity: 0.1; position: absolute; z-index: 1; }
        .error-content { position: relative; z-index: 2; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .animated-404 { animation: float 4s ease-in-out infinite; font-size: 4rem; font-weight: 800; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <div class="error-content" data-reveal>
            <div class="animated-404">Oops!</div>
            <h1 class="section-title">Barrier Detected</h1>
            <p style="margin-bottom: 30px; color: var(--text-muted);">The page you are looking for has either been moved, deleted, or never existed in this accessible universe.</p>
            <a href="index.html" class="btn btn-primary">Return to Safety</a>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/accessibility.js"></script>

    <button id="back-to-top" class="back-to-top" title="Back to Top" aria-label="Back to Top"><i class="fas fa-arrow-up"></i></button>
</body>
</html>
