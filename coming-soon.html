<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <title>Coming Soon | WACAAegis</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .coming-soon { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: white; text-align: center; overflow: hidden; position: relative; }
        .countdown { display: flex; gap: 20px; justify-content: center; margin: 40px 0; }
        .count-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; min-width: 100px; border: 1px solid rgba(255,255,255,0.1); }
        .count-num { font-size: 2.5rem; font-weight: 800; display: block; color: var(--primary); }
        .count-label { font-size: 12px; text-transform: uppercase; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="coming-soon">
        <div data-reveal>
            <a href="index.html" class="logo" style="margin-bottom: 40px; justify-content: center;">
                <i class="fas fa-universal-access"></i>
                <span>WACAAegis</span>
            </a>
            <h1 class="section-title" style="color: white; -webkit-fill-color: white;">I're Enhancing Inclusion</h1>
            <p style="color: #94a3b8; max-width: 600px; margin: 0 auto;">My new automated remediation engine is almost ready. Stay tuned for the most powerful accessibility tool on the market.</p>
            
            <div class="countdown">
                <div class="count-box">
                    <span class="count-num" id="days">24</span>
                    <span class="count-label">Days</span>
                </div>
                <div class="count-box">
                    <span class="count-num" id="hours">12</span>
                    <span class="count-label">Hours</span>
                </div>
                <div class="count-box">
                    <span class="count-num" id="minutes">45</span>
                    <span class="count-label">Mins</span>
                </div>
                <div class="count-box">
                    <span class="count-num" id="seconds">30</span>
                    <span class="count-label">Secs</span>
                </div>
            </div>

            <form style="max-width: 500px; margin: 0 auto; display: flex; gap: 10px;">
                <input type="email" placeholder="Get notified via email" style="flex-grow: 1; padding: 15px; border-radius: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white;" required>
                <button type="submit" class="btn btn-primary" style="padding: 15px 30px;">Notify Me</button>
            </form>
            
            <p style="margin-top: 40px; font-size: 14px; opacity: 0.5;">Scheduled launch: June 2026</p>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        // Simple Countdown logic
        let d = 24, h = 12, m = 45, s = 30;
        setInterval(() => {
            s--;
            if(s < 0) { s = 59; m--; }
            if(m < 0) { m = 59; h--; }
            if(h < 0) { h = 23; d--; }
            document.getElementById('days').innerText = d;
            document.getElementById('hours').innerText = h;
            document.getElementById('minutes').innerText = m;
            document.getElementById('seconds').innerText = s;
        }, 1000);
    </script>

    <button id="back-to-top" class="back-to-top" title="Back to Top" aria-label="Back to Top"><i class="fas fa-arrow-up"></i></button>
</body>
</html>
